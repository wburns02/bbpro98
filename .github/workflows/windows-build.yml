name: windows-build
# Cross-compiles bbfix.dll, bblaunch.exe and the mods for 32-bit Windows with zig cc, from the public source only,
# and keeps the zip as a workflow artifact. Binaries are never committed.
on:
  push:
    branches: [main]
    paths: ['src-latest/**', 'tools/build_release.sh', 'release/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ziglang==0.16.0
      - run: tools/build_release.sh "$RUNNER_TEMP/dist" python
      - uses: actions/upload-artifact@v4
        with:
          name: bbfix-windows
          path: ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error
