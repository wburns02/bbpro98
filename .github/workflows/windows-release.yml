name: windows-release
# On a v* tag: the same build as windows-build, attached to a DRAFT release. A person publishes it by hand.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ziglang==0.16.0
      - run: tools/build_release.sh "$RUNNER_TEMP/dist" python
      - run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/*.zip --draft --title "bbfix $GITHUB_REF_NAME" --notes-file release/README.txt
        env:
          GH_TOKEN: ${{ github.token }}
