[PlayBalance]
; By Knuckleball Lover
; Version 5.1 
; Maximize this window for easier viewing
; Recent changes
;------------------------------------------------------------------------------------------------
; -Attempts to get hitters to be more aggressive swinging the bat with less than 2 strikes and get
;  more swings at balls.
; -Tweaked other settings to be more lifelike, such as batspeed, and pitch speeds.
; -Another attempt at getting very high saves. Since CGs are rare these days, and the game tends to
;  use bad judgement anyway, getting high saves might be easier.
; -Check swings should succeed more often so that hitters can hold up on close pitches on occassion.
;------------------------------------------------------------------------------------------------
; Problems Solved/Existing
; + Denotes solved problem or benefit granted, - denotes weakness or still existing concerns
;------------------------------------------------------------------------------------------------
; + Swing speeds are consistant with major league levels, provided ratings are accurate.
; + Speed is a factor in run production. Speedy teams will score more noticably more runs.
; + Even fast runners will get caught dead stealing if they choose the wrong pitch to run on.
; + SH's and SF's are commonplace, especially in non-DH leagues.
; + Bunts have a degree of risk to them and won't always lay down nicely.
; + Pitch ratings are as meaningful if not more so than velocity.
; + Knuckleballs are inconsistant and hard to control, but can be very effective in the hands
;   of a pitcher talented with the pitch. Especially true if he has other good pitches to
;   complement the knuckler. ESEPCIALLY true if a pitcher throws hard as well.
; + Position players won't pitch as often, unless qualified to do so.
; + Saves as a TEAM are realistic. Remember the pb file can't say WHO to put in for the save.
; + CG's are nice, even in non-DH leagues.
; + Hit angles are realsitic to give majestic homerun balls and high pop ups.
; + Low PH, high CH players can hit .320 or more.
; + High PH, low CH players strike out a lot, but most hits will be extra bases.
; + GF is important, use it wisely. With it you can create all kinds of players. From Tony
;   Gwynn types (High average, low power) to Jose Canseco types (High power, low average), and
;   even make bad players that have "good" ratings, such as a 95 CH, 30 PH, 20 GF player. He
;   will likely hit weak flyballs all year long.
; + Ratings all around are important. A 5 point difference has a significant statistical impact
;   everywhere (less so in errors)
; + I'll say it again, speed kills. EXPECT high speed guys to get a LOT of triples, SBs, and be much
;   better on defense, even compensating for delay (especially in the OF)
; + Expect a lot of plays at the bags and the plate. Fielders will be aggressive in trying to get
;   outs when throwing the ball.
; + K's for good pitchers will be high for power pitchers (maybe still a little too high) but slower
;   throwers as well as those with mediocre pitch ratings will not strike out many. Slow throwers with
;   VERY high ratings will get Ks like the power pitchers do, but they will need MUCH higher ratings and
;   generally something unique about them, such as being Lefty, Sidearm with CB, SC, SI pitches. This
;   pitcher also has 90, 80, 70 pitch ratings and 97 CO. He still allows .270+ average against him though.
; + Players can hit to all fields, including down the lines.
; - Still can't workaround the BBPro annoyance of taking out pitchers that are dominating in the 7
;   inning or later and aren't tired. Seems teams in the lead suffer more from this.
; - Individual save totals inconsistant because of the above problem.
; - High rated players may perform too well, compared to MLB bests.
;--------------------------------------------------------------------------------------------------

