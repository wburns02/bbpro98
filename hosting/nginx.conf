# The only service the tunnel reaches (127.0.0.1:6150). Every request needs the PIN gate's cookie (hosting/gate.py);
# without it the visitor is sent to the PIN form. Run as the hosting user:
#   nginx -e stderr -p /mnt/data/bbpro98/gate/ -c /mnt/data/bbpro98/gate/nginx.conf -g 'daemon off;'
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_cf_connecting_ip $visitor { '' $remote_addr; default $http_cf_connecting_ip; }

    server {
        listen 127.0.0.1:6150;
        client_max_body_size 4k;
        absolute_redirect off;                        # behind the tunnel: never http://host:6150/...
        proxy_set_header X-Real-IP $visitor;

        location /gate/ {
            proxy_pass http://127.0.0.1:6154;
        }

        location = /gate/auth {                       # nginx asks through /_gate_auth; visitors have no use for it
            return 404;
        }

        location = /_gate_auth {
            internal;
            proxy_pass http://127.0.0.1:6154/gate/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @login {
            # $request_uri is the raw request line (no decoded CR/LF) and nginx cannot percent-encode it, so `next`
            # must stay the LAST parameter: gate.py (next_from_query) takes everything after `next=` as the address.
            return 302 /gate/login?next=$request_uri;
        }

        location /news {
            auth_request /_gate_auth;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:6153;
        }

        location /create {                            # Create a Player (news/createweb.py): writes the game's files
            auth_request /_gate_auth;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:6155;
        }

        location / {                                  # noVNC page and its websocket
            auth_request /_gate_auth;
            error_page 401 = @login;
            proxy_pass http://127.0.0.1:6152;
            add_header X-Frame-Options SAMEORIGIN always;     # no framing from sibling subdomains (same site)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
